<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ t }} · Cerro Azul</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/admin/static/theme.css?v={{ v }}">
  <script src="/admin/static/theme.js?v={{ v }}"></script>
</head>
{%- set kind = kind|default('public') %}
{%- set width = width|default('narrow') %}
<body class="page page--{{ kind }} page--{{ width }}">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
{%- if kind == 'admin' %}
  <header class="appbar">
    <div class="appbar__inner">
      <a class="brand" href="/admin" aria-label="Cerro Azul Reuniones: ir al panel">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 19 9 8.5l3.6 5.4 2.6-3.6L21.5 19z"/></svg></span>
        <span class="brand__name">Cerro Azul</span>
        <span class="brand__product">Reuniones</span>
      </a>
      <details class="menu">
        <summary class="btn btn--ghost btn--icon menu__trigger" aria-label="Menú">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
        </summary>
        <div class="menu__popover">
          <div class="menu__section" data-js-only hidden>
            <span class="eyebrow" id="apariencia-t">Apariencia</span>
            <div class="segmented" role="group" aria-labelledby="apariencia-t">
              <button type="button" data-theme-set="auto" aria-pressed="true">Auto</button>
              <button type="button" data-theme-set="light" aria-pressed="false">Claro</button>
              <button type="button" data-theme-set="dark" aria-pressed="false">Oscuro</button>
            </div>
          </div>
          <hr class="menu__sep" data-js-only hidden>
          <form method="post" action="/admin/logout">
            <button class="menu__item" type="submit">Cerrar sesión
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>
            </button>
          </form>
        </div>
      </details>
    </div>
  </header>
{%- elif kind == 'public' %}
  <div class="hero">
    <div class="hero__inner">
      <span class="brand__mark brand__mark--hero" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 19 9 8.5l3.6 5.4 2.6-3.6L21.5 19z"/></svg></span>
      <span>Cerro Azul</span>
    </div>
  </div>
{%- endif %}
  <main id="contenido" class="container container--{{ width }}" tabindex="-1">
    {{ body|safe }}
  </main>
{%- if kind != 'admin' %}
  <footer class="footer">
    <span>Cerro Azul</span>
    <span aria-hidden="true" data-js-only hidden>·</span>
    <button class="theme-cycle" type="button" data-js-only hidden>Apariencia: <span data-theme-label>Automático</span>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </footer>
{%- endif %}
</body>
</html>
