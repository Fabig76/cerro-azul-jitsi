<h1>{{titulo}}</h1>
<p class="m">Rol al entrar: <b>{{rol}}</b></p>
<div class="o">
  <b>Programada:</b> {{fecha_utc}}<br>
  <b>Duracion:</b> {{duracion}} minutos
</div>
<!--DESC-->
<h2>Unirse a la reunion</h2>
<p class="m">Entraras con microfono y camara apagados. Para hablar, levanta la mano: la administracion te dara la palabra.</p>
<form method="post" action="/unirse">
  <input type="hidden" name="slug" value="{{slug}}">
  <label>Apartamento <small>(opcional, ej. 302 o T2-302)</small></label>
  <input name="apto" maxlength="20" placeholder="302">
  <label>Tu nombre</label>
  <input name="nombre" required maxlength="50" placeholder="Como te identificaran">
  <button type="submit">Entrar a la reunion</button>
</form>
