<section class="card card--sheet authcard" aria-labelledby="login-t">
  <header class="authcard__head">
    <span class="brand__mark brand__mark--lg" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 19 9 8.5l3.6 5.4 2.6-3.6L21.5 19z"/></svg></span>
    <h1 class="authcard__title" id="login-t">{{site}}</h1>
    <!--SUB-->
  </header>
  <!--ERR-->
  <form method="post" class="form" data-loading>
    <div class="field">
      <label class="field__label" for="f-user">Usuario</label>
      <input class="field__input" id="f-user" name="user" required autofocus
             autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="field">
      <label class="field__label" for="f-password">Contraseña</label>
      <input class="field__input" id="f-password" name="password" type="password" required
             autocomplete="current-password">
    </div>
    <button class="btn btn--primary btn--lg btn--block" type="submit">Entrar</button>
  </form>
</section>
<p class="authnote">Acceso restringido al personal autorizado<!--DE-SITE-->.</p>
