name: jitsi-meet

# =====================================================================
# Jitsi Meet - Cerro Azul (meet.urbcerroazul.com)
#
# Stack standalone: NO toca los contenedores existentes (Monitor Legal,
# Minuta Segura, Hermes). El reverse proxy es el Caddy existente, que
# corre en otro proyecto de compose (hermes-agent) y esta conectado a la
# red `jitsi-meet_jitsi` para resolver `web` y `admin`.
#
# Todas las rutas son RELATIVAS a este archivo: el repo se puede clonar
# en cualquier ruta y `docker compose up -d --build` funciona.
#
# Las variables vienen del .env (ver .env.example). La version de las
# imagenes se fija UNA vez en JITSI_IMAGE_VERSION.
# =====================================================================

services:
  # ---------------------------------------------------------------
  # WEB (nginx + UI de Jitsi)
  # ---------------------------------------------------------------
  web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable-11031}
    container_name: jitsi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"      # solo localhost, Caddy hace TLS publico
    environment:
      - PUBLIC_URL
      - ENABLE_AUTH
      - AUTH_TYPE
      - ENABLE_GUESTS
      - JWT_APP_ID
      - JWT_APP_SECRET
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_BOSH_URL_BASE
      - ENABLE_COLIBRI_WEBSOCKET=1
      # Fase 2: todos entran con mic y camara apagados. Verificado en
      # /defaults/settings-config.js de jitsi/web:stable-11031
      # (config.startWithAudioMuted / config.startWithVideoMuted).
      - START_WITH_AUDIO_MUTED
      - START_WITH_VIDEO_MUTED
      - TZ
    volumes:
      - ./web/config:/config
      - ./web/crash:/crash
      - ./web/letsencrypt:/etc/letsencrypt
    depends_on:
      prosody:
        condition: service_healthy
    networks: [jitsi]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------
  # PROSODY (XMPP server)
  # ---------------------------------------------------------------
  prosody:
    # Imagen propia: la oficial no trae mod_http_health y sin el endpoint
    # /health el servicio 70-register-setup no registra las cuentas de
    # focus@/jvb@ -> Jicofo y JVB no se autentican -> 0 bridges -> sin audio.
    # Ver prosody/Dockerfile.prosody para el detalle.
    build:
      context: .
      dockerfile: prosody/Dockerfile.prosody
      args:
        JITSI_IMAGE_VERSION: ${JITSI_IMAGE_VERSION:-stable-11031}
    image: jitsi-prosody-cerroazul:${JITSI_IMAGE_VERSION:-stable-11031}
    container_name: jitsi-prosody
    restart: unless-stopped
    expose:
      - "5222"     # cliente XMPP (clients web)
      - "5347"     # componentes internos (jicofo, jvb)
      - "5280"     # BOSH
    environment:
      - AUTH_TYPE
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - XMPP_BOSH_URL_BASE
      - JICOFO_AUTH_PASSWORD
      - JVB_AUTH_PASSWORD
      - JWT_APP_ID
      - JWT_APP_SECRET
      - ENABLE_AUTH
      # Fase 2 - JWT obligatorio. La plantilla de Prosody decide con
      # PROSODY_AUTH_TYPE (AUTH_TYPE solo es su fallback).
      - PROSODY_AUTH_TYPE
      - JWT_ACCEPTED_ISSUERS
      - JWT_ACCEPTED_AUDIENCES
      - JWT_ALLOW_EMPTY
      - JWT_ENABLE_DOMAIN_VERIFICATION
      - ENABLE_GUESTS
      - ENABLE_LOBBY
      - ENABLE_AV_MODERATION
      # token_affiliation va en el componente MUC (XMPP_MUC_MODULES), no en
      # el VirtualHost (XMPP_MODULES). Ver .env.example.
      - XMPP_MUC_MODULES
      - PUBLIC_URL
      - TZ
      - TURN_CREDENTIALS
      - TURN_HOST
      - TURN_PORT
      - TURN_TRANSPORT
      - STUN_HOST
      - STUN_PORT
    volumes:
      - ./prosody/config:/config
      # Los plugins de Jitsi NO vienen en la imagen oficial: se extraen
      # del paquete Debian `jitsi-meet-prosody` (repo unstable). Ver
      # scripts/install-prosody-plugins.sh. Son 84 modulos .lua.
      - ./prosody/prosody-plugins:/prosody-plugins
      - ./prosody/prosody-plugins-custom:/prosody-plugins-custom
    networks: [jitsi]
    healthcheck:
      # Prosody en modo 'client' NO escucha en 5222 de forma verificable
      # por HTTP (es XMPP puro) y la imagen NO trae 'nc'. El puerto que
      # responde HTTP es 5280 (BOSH/websocket).
      # Ojo: /health NO existe (mod_http_health no viene en la imagen),
      # asi que se comprueba la raiz.
      test: ["CMD-SHELL", "curl -fsS http://localhost:5280/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------
  # JICOFO (conference focus)
  # ---------------------------------------------------------------
  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable-11031}
    container_name: jitsi-jicofo
    restart: unless-stopped
    environment:
      - AUTH_TYPE
      - XMPP_DOMAIN
      - XMPP_AUTH_DOMAIN
      - XMPP_MUC_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - JICOFO_AUTH_PASSWORD
      - JWT_APP_ID
      - JWT_APP_SECRET
      # Fase 2: auth de Jicofo APAGADA a proposito (con JWT en Jicofo todo
      # usuario autenticado seria owner) y sin auto-owner (si no, el primero
      # en entrar seria moderador). El rol lo da token_affiliation en Prosody.
      - JICOFO_ENABLE_AUTH
      - ENABLE_AUTO_OWNER
      - MAX_PARTICIPANTS
      - TZ
    volumes:
      - ./jicofo/config:/config
    depends_on:
      prosody:
        condition: service_healthy
    networks: [jitsi]
    healthcheck:
      # Jicofo NO expone /about/health (devuelve 404). La ruta que
      # responde es /stats (Prometheus). Verificado en produccion.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/stats >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------
  # JVB (videobridge) - soporte para 200 audio + 1 camara + pantalla
  #
  # NO se fija LOCAL_ADDRESS: el entrypoint de la imagen lo autodetecta
  # (`export LOCAL_ADDRESS=$(ip route get 1 ...)`) y pisa la variable.
  # Fijarlo a mano solo produce drift cuando cambia la IP del contenedor.
  # JVB_ADVERTISE_IPS viene del .env (IP publica del VPS).
  # ---------------------------------------------------------------
  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-11031}
    container_name: jitsi-jvb
    restart: unless-stopped
    environment:
      - XMPP_AUTH_DOMAIN
      - XMPP_INTERNAL_MUC_DOMAIN
      - XMPP_SERVER
      - JVB_AUTH_PASSWORD
      - JVB_BREWERY_MUC
      - JVB_PORT=10000
      - JVB_TCP_PORT=4443
      - JVB_TCP_MAPPED_PORT=4443
      - COLIBRI_REST_ENABLED=true
      - JVB_ADVERTISE_IPS
      - SHUTDOWN_REST_ENABLED=false
      - ENABLE_COLIBRI_WEBSOCKET=1
      - JVB_WS_DOMAIN
      - DISABLE_AWS_HARVESTER=true
      - MAX_PARTICIPANTS
      - PUBLIC_URL
      - TZ
    volumes:
      - ./jvb/config:/config
    ports:
      # UDP 10000 (RTP) - DEBE estar expuesto a internet (no localhost)
      - "10000:10000/udp"
      # TCP 4443: websocket Colibri (fallback de medio y signalling).
      # El JVB lo anuncia como wss://<dominio>/colibri-ws/<server-id>.
      - "4443:4443/tcp"
    depends_on:
      prosody:
        condition: service_healthy
    networks: [jitsi]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/about/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------
  # ADMIN PANEL (Cerro Azul)
  # ---------------------------------------------------------------
  admin:
    build: ./admin-panel
    image: jitsi-admin:local
    container_name: jitsi-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"   # localhost only, Caddy hace proxy
    env_file:
      - .env
    volumes:
      - ./admin-panel/instance:/app/instance
      # El panel lee los secretos de Jitsi del .env del proyecto.
      - ./.env:/opt/jitsi-meet/.env:ro
    depends_on:
      prosody:
        condition: service_healthy
    networks: [jitsi]
    healthcheck:
      # La imagen es python:3.12-slim: NO trae curl ni wget.
      # Se usa python (que si esta) contra el endpoint propio del panel.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/healthz', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  jitsi:
    driver: bridge
    name: jitsi-meet_jitsi
