name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────
  # 1. Sin secretos en el repo ni en el historial
  # ───────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks (sin secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # necesario para escanear todo el historial
      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allowlist: el .env.example solo tiene placeholders.
          args: --config-path .gitleaks.toml

  # ───────────────────────────────────────────────────────────────
  # 2. El compose es valido y resuelve
  # ───────────────────────────────────────────────────────────────
  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba a partir del ejemplo
        run: |
          cp .env.example .env
          # Reemplazar los placeholders con valores validos de prueba.
          sed -i \
            -e 's|^PUBLIC_URL=.*|PUBLIC_URL=meet.example.com|' \
            -e 's|^XMPP_DOMAIN=.*|XMPP_DOMAIN=meet.example.com|' \
            -e 's|^XMPP_AUTH_DOMAIN=.*|XMPP_AUTH_DOMAIN=auth.meet.example.com|' \
            -e 's|^XMPP_MUC_DOMAIN=.*|XMPP_MUC_DOMAIN=muc.meet.example.com|' \
            -e 's|^XMPP_INTERNAL_MUC_DOMAIN=.*|XMPP_INTERNAL_MUC_DOMAIN=internal-muc.meet.example.com|' \
            -e 's|^XMPP_RECORDER_DOMAIN=.*|XMPP_RECORDER_DOMAIN=recorder.meet.example.com|' \
            -e 's|^JVB_WS_DOMAIN=.*|JVB_WS_DOMAIN=meet.example.com|' \
            -e 's|^TURN_HOST=.*|TURN_HOST=meet.example.com|' \
            -e 's|^JVB_ADVERTISE_IPS=.*|JVB_ADVERTISE_IPS=203.0.113.10|' \
            .env
          ./gen-passwords.sh | grep -E '^[A-Z_]+=' | while IFS= read -r l; do
            k="${l%%=*}"; v="${l#*=}"
            sed -i "s|^${k}=.*|${k}=${v}|" .env
          done
      - name: Validar el .env
        run: ./scripts/validate-env.sh .env
      - name: docker compose config
        run: docker compose config --quiet
      - name: Comprobar que las 5 imagenes estan fijadas a version
        run: |
          # Ni 'stable' ni 'latest': la version se fija una vez.
          if docker compose config | grep -E 'image:.*:(stable|latest)$'; then
            echo "::error::hay una imagen sin version fija"
            exit 1
          fi
      - name: Comprobar que los 5 servicios tienen healthcheck
        run: |
          n=$(docker compose config --format json | jq '[.services[] | select(.healthcheck != null)] | length')
          echo "servicios con healthcheck: $n"
          [ "$n" -eq 5 ] || { echo "::error::faltan healthchecks"; exit 1; }

  # ───────────────────────────────────────────────────────────────
  # 3. La imagen del admin se construye desde un clon limpio
  #    (este era el bug: el Dockerfile copiaba app/app.py pero el repo
  #     tenia los archivos planos)
  # ───────────────────────────────────────────────────────────────
  admin-build:
    name: build imagen admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t jitsi-admin:ci ./admin-panel
      - name: La app arranca y responde /healthz
        run: |
          mkdir -p /tmp/inst
          docker run --rm -d --name adm -p 18081:8081 \
            -v /tmp/inst:/app/instance \
            -e JITSI_ENV_FILE=/nonexistent \
            jitsi-admin:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18081/healthz; then
              echo ""
              echo "::notice::admin responde correctamente"
              docker rm -f adm
              exit 0
            fi
            sleep 2
          done
          echo "::error::el admin no respondio /healthz"
          docker logs adm || true
          docker rm -f adm || true
          exit 1

  # ───────────────────────────────────────────────────────────────
  # 4. Lint del codigo Python del panel admin
  # ───────────────────────────────────────────────────────────────
  ruff:
    name: ruff (admin-panel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check admin-panel/app/app.py
      - name: ruff format --check
        # No bloquea el pipeline: informa del estado sin impedir el merge.
        continue-on-error: true
        run: ruff format --diff admin-panel/app/app.py

  # ───────────────────────────────────────────────────────────────
  # 5. El bloque de Caddy es valido
  # ───────────────────────────────────────────────────────────────
  caddy:
    name: caddy validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar el bloque de Caddy
        run: |
          docker run --rm \
            -v "$PWD/infra/caddy:/conf:ro" \
            caddy:2-alpine \
            caddy validate --adapter caddyfile --config /conf/meet.urbcerroazul.com.caddy
      - name: Comprobar que el bloque no usa 127.0.0.1 (Caddy corre en contenedor)
        run: |
          # Caddy corre en un contenedor: 127.0.0.1 seria el propio
          # contenedor, no el host. Debe usar el DNS de la red Docker.
          if grep -nE 'reverse_proxy[[:space:]]+127\.0\.0\.1' infra/caddy/meet.urbcerroazul.com.caddy; then
            echo "::error::el bloque usa 127.0.0.1; Caddy corre en un contenedor"
            exit 1
          fi
          echo "::notice::el bloque usa el DNS de la red Docker"

  # ───────────────────────────────────────────────────────────────
  # 6. Los scripts de shell son validos
  # ───────────────────────────────────────────────────────────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: bash -n en todos los scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n
      - name: shellcheck
        continue-on-error: true
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -x || true
