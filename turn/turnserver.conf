# =====================================================================
# turnserver.conf - Servidor TURN/STUN de Cerro Azul (Fase 4)
#
# POR QUE HAY UN TURN:
#   Sin servidor TURN, quien este en una red corporativa o en un operador
#   movil que bloquea UDP entra a la sala pero NO OYE NADA. El Jitsi Meet
#   solo ve el candidato 'host' (UDP directo) y no hay por donde sacar el
#   audio. El TURN relayiza: el cliente sale por TCP/TLS y el servidor le
#   devuelve los paquetes del JVB.
#
# COMPARTIR EL SECRETO:
#   'use-auth-secret' + 'static-auth-secret' hace que coturn firme
#   credenciales TEMPORALES con un secreto compartido. Es el MISMO valor
#   que TURN_CREDENTIALS en el .env de Jitsi, y es lo que permite que el
#   cliente de cada participante reciba una credencial distinta y de corta
#   duracion (Prosody la firma con external_service_secret, que tambien es
#   TURN_CREDENTIALS). Nunca se envia la contrasena del TURN al cliente.
#
# PUERTOS (verificado en el arranque del contenedor):
#   3478/udp y 3478/tcp  -> TURN estandar. El TCP es el que entra cuando
#                           la red bloquea UDP.
#   444/udp               -> puerto alterno (ver 'alt-listening-port').
#   443/tcp               -> TURN sobre TLS (turns). En este servidor el
#                           443/TCP esta libre (a diferencia del servidor
#                           de Jitsi, donde lo usa Caddy).
#
# OJO: coturn solo acepta UN 'listening-port'. Si se pone dos veces, el
# segundo SOBREESCRIBE al primero y el primero deja de escuchar (asi se
# comporto en la primera prueba: al anadir 443 desaparecio 3478). Para
# tener mas de un puerto UDP se usa 'alt-listening-port'.
# =====================================================================

# Puerto de escucha principal (UDP y TCP).
listening-port=3478

# Puerto UDP alterno (443). Se anuncia en las respuestas del servidor para
# los clientes que no pueden usar el principal. Es el puerto que mejor
# atraviesa los firewalls de empresa.
alt-listening-port=443

# TURN sobre TLS en 443: la variante que entra en las redes mas
# restrictivas (corporativas que solo dejan pasar 443). Requiere
# certificado. El de Let's Encrypt necesita un nombre DNS propio para
# 'turn.<dominio>'; mientras no exista, se usa un certificado autofirmado
# (los clientes WebRTC no validan el certificado del servidor TURN: la
# seguridad la aporta el secreto compartido, no el TLS).
tls-listening-port=443
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

# Realm: debe ser el dominio del servicio.
realm=urbcerroazul.com

# Firmar credenciales de corta duracion con el secreto compartido.
use-auth-secret
static-auth-secret=CAMBIAR_CON_EL_TURN_CREDENTIALS_DE_JITSI

# Sin CLI ni multicast.
no-cli
no-multicast-peers

# Los rangos de relay (puertos UDP que el TURN abre para el medio).
min-port=49160
max-port=49200

# Prohibir relay hacia redes privadas: si alguien intenta usarlo como
# proxy hacia la red interna del conjunto, se le corta.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# Registro en stdout (lo recoge docker logs).
log-file=stdout
